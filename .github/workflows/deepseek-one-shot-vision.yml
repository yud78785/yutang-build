name: YuTang one-shot production vision - DeepSeek primary / OpenRouter backup

on:
  push:
    branches:
      - experiment/video-component-pilot-20261113
    paths:
      - .github/workflows/deepseek-one-shot-vision.yml
      - tools/live-vision-acceptance.mjs
      - tools/verify_deepseek_live_vision.py
      - tests/test-live-vision-provider.mjs
      - docs/deepseek-one-shot-vision.md

concurrency:
  group: yutang-one-shot-provider-vision-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  one-shot-production-vision:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Enforce one bounded public-video observation only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yud78785/yutang-build"
          test "$GITHUB_REF" = "refs/heads/experiment/video-component-pilot-20261113"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$RUNNER_OS" = "Linux"
          echo "One API request maximum; 3 previously verified JPEGs; max 1200 output tokens; no browser/action tools/audio/memory"

      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download immutable original Windows video capture evidence
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/evidence
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 45 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/yud78785/yutang-build/actions/artifacts/13951609541/zip" \
            -o work/original-Windows-evidence.zip
          printf '5b2f2432a25ef6e2581be64eb58c352652d39b245d1a0036682e39e7acac3849  work/original-Windows-evidence.zip\n' | sha256sum -c
          unzip -q work/original-Windows-evidence.zip -d work/evidence
          test "$(find work/evidence -maxdepth 1 -type f | wc -l)" -eq 4
          echo "Original artifact 13951609541 and ZIP SHA-256 verified"

      - name: Checkout exact original production ApiAgent source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/LockyBee/dsh-douyin-agent.git upstream
          git -C upstream checkout --detach 912873e2556d16a088d81dcbc6f7c0060614dd58
          test "$(git -C upstream rev-parse HEAD)" = "912873e2556d16a088d81dcbc6f7c0060614dd58"
          test "$(git -C upstream hash-object api-agent.mjs)" = "8f5187dc9e48f1ca1a91b8c545236233d68268e6"
          node --check upstream/api-agent.mjs
          node --check tools/live-vision-acceptance.mjs
          node --test tests/test-live-vision-provider.mjs
          echo "Original production ApiAgent source and provider fallback tests passed"

      - name: Select one configured provider without exposing any credential
        id: vision_provider
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUESTED_PROVIDER: ${{ vars.YUTANG_VISION_PROVIDER }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_PROVIDER:-auto}"
          case "$requested" in
            auto)
              if [ -n "${DEEPSEEK_API_KEY:-}" ]; then provider=deepseek
              elif [ -n "${OPENROUTER_API_KEY:-}" ]; then provider=openrouter
              else provider=none
              fi
              ;;
            deepseek)
              if [ -n "${DEEPSEEK_API_KEY:-}" ]; then provider=deepseek; else provider=none; fi
              ;;
            openrouter)
              if [ -n "${OPENROUTER_API_KEY:-}" ]; then provider=openrouter; else provider=none; fi
              ;;
            *) echo "Unsupported provider selector; no request sent."; exit 1 ;;
          esac
          if [ "$provider" = none ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No selected provider credential is configured. Zero model requests will be sent."
            python3 - <<'PY'
          import json
          from pathlib import Path
          Path("work/deepseek-live-vision-receipt.json").write_text(json.dumps({
            "status":"SKIPPED_NO_SUPPORTED_PROVIDER_KEY_SECRET",
            "request_count":0,
            "network_request_sent":False,
            "user_account_or_personal_pc_used":False,
            "api_key_value_or_presence_logged":False
          },indent=2)+"\n")
          PY
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "provider=$provider" >> "$GITHUB_OUTPUT"
            echo "One bounded request is enabled for the selected provider. Credential values remain hidden."
          fi

      - name: Make exactly one production visual request (only if selected secret exists)
        if: steps.vision_provider.outputs.available == 'true'
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YUTANG_VISION_PROVIDER: ${{ steps.vision_provider.outputs.provider }}
          YUTANG_ALLOW_LIVE_VISION_ACCEPTANCE: "1"
        run: |
          set -euo pipefail
          set +e
          node tools/live-vision-acceptance.mjs work/evidence > work/deepseek-live-vision.log 2>&1
          rc=$?
          set -e
          echo "PRODUCTION_AGENT_EXIT_CODE $rc (the source script intentionally exits 1 to force independent semantic review)"
          python3 tools/verify_deepseek_live_vision.py work/deepseek-live-vision.log "$rc" > work/deepseek-live-vision-receipt.json
          echo "ONE_REAL_PRODUCTION_VISION_RESPONSE_RECEIVED; INDEPENDENT_REVIEW_REQUIRED"

      - name: Upload bounded decision receipt only (no key, JPEG, cookies or account data)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: YuTang-One-Shot-Production-Vision-NOT-AUTONOMY
          path: |
            work/deepseek-live-vision.log
            work/deepseek-live-vision-receipt.json
          if-no-files-found: warn
          retention-days: 7
