name: YuTang 1.4.7 Windows shortcut handle experiment - NOT RELEASE

on:
  push:
    branches:
      - experiment/windows-147-shortcut-handle-20261114
      - experiment/windows-147-shortcut-handle-fix-20261114
      - experiment/windows-147-shortcut-handle-integration-20261114
    paths:
      - .github/workflows/windows-147-shortcut-handle-experiment.yml
      - tools/jobguard/shortcut_file_windows.go
      - tools/jobguard/shortcut_file_windows_test.go
      - tools/jobguard/shortcut_request.go
      - tools/jobguard/shortcut_request_test.go
      - tools/jobguard/main_windows.go
      - tools/jobguard/guard_request.go
      - tools/jobguard/args.go
      - tools/jobguard/go.mod
      - tools/windows147-update-patched/update-transaction.mjs
      - tools/windows147-update-patched/update-launcher.mjs
      - tools/apply_windows147_update_trust_patch.mjs
      - tests/windows147-update-transaction.test.mjs
      - tests/windows147-update-trust.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-shortcut-handle:
    name: '${{ matrix.os }} shortcut handle safety'
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Checkout isolated experiment without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify exact experiment scope
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'yud78785/yutang-build') { throw 'WRONG_REPOSITORY' }
          $allowedRefs = @(
            'refs/heads/experiment/windows-147-shortcut-handle-20261114',
            'refs/heads/experiment/windows-147-shortcut-handle-fix-20261114',
            'refs/heads/experiment/windows-147-shortcut-handle-integration-20261114'
          )
          if ($allowedRefs -cnotcontains $env:GITHUB_REF) { throw 'WRONG_EXPERIMENT_BRANCH' }
          if ($env:RUNNER_OS -cne 'Windows') { throw 'WINDOWS_RUNNER_REQUIRED' }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.17.0

      - name: Run native Windows shortcut handle tests
        shell: pwsh
        working-directory: tools/jobguard
        run: |
          $ErrorActionPreference = 'Stop'
          go version
          go test -count=5 -timeout=90s ./...
          if ($LASTEXITCODE -ne 0) { throw 'SHORTCUT_HANDLE_NATIVE_TESTS_FAILED' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'SHORTCUT_HANDLE_NATIVE_VET_FAILED' }
          go build -trimpath -ldflags="-s -w" -o shortcut-handle-probe.exe .
          if ($LASTEXITCODE -ne 0) { throw 'SHORTCUT_HANDLE_PROBE_BUILD_FAILED' }
          $sha = (Get-FileHash -LiteralPath shortcut-handle-probe.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ('SHORTCUT_HANDLE_PROBE_SHA256=' + $sha)
          $probe = (Resolve-Path -LiteralPath 'shortcut-handle-probe.exe').Path
          $env:YUTANG_JOBGUARD_PATH = $probe
          $env:YUTANG_JOBGUARD_SHA256 = $sha
          node --check (Join-Path $env:GITHUB_WORKSPACE 'tools/windows147-update-patched/update-transaction.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'UPDATE_TRANSACTION_NODE_SYNTAX_FAILED' }
          node --check (Join-Path $env:GITHUB_WORKSPACE 'tools/windows147-update-patched/update-launcher.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'UPDATE_LAUNCHER_NODE_SYNTAX_FAILED' }
          node --check (Join-Path $env:GITHUB_WORKSPACE 'tools/apply_windows147_update_trust_patch.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'UPDATE_PATCHER_NODE_SYNTAX_FAILED' }
          Push-Location $env:GITHUB_WORKSPACE
          node --test tests/windows147-update-transaction.test.mjs tests/windows147-update-trust.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_SHORTCUT_UPDATER_NODE_REGRESSIONS_FAILED' }
          Pop-Location
          $probeDir = Join-Path $env:TEMP ('yutang-shortcut-cli-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probeDir | Out-Null
          try {
            $shortcut = Join-Path $probeDir 'YuTang.lnk'
            $backup = Join-Path $probeDir 'YuTang.backup.lnk'
            $temporary = Join-Path $probeDir 'YuTang.temporary.lnk'
            $quarantine = Join-Path $probeDir 'YuTang.quarantine.lnk'
            [System.IO.File]::WriteAllText($shortcut, 'old shortcut')
            [System.IO.File]::WriteAllText($temporary, 'new shortcut')
            $oldSha = (Get-FileHash -LiteralPath $shortcut -Algorithm SHA256).Hash.ToLowerInvariant()
            $newSha = (Get-FileHash -LiteralPath $temporary -Algorithm SHA256).Hash.ToLowerInvariant()
            $output = & $probe --shortcut-commit --owner-pid $PID --shortcut $shortcut --backup $backup --temporary $temporary --old-sha256 $oldSha --new-sha256 $newSha
            $outputText = [string]($output -join "`n")
            if ($LASTEXITCODE -ne 0 -or -not ($outputText -match 'SHORTCUT_OPERATION_OK --shortcut-commit')) { throw ('SHORTCUT_CLI_COMMIT_FAILED: ' + $outputText) }
            if ((Get-FileHash -LiteralPath $shortcut -Algorithm SHA256).Hash.ToLowerInvariant() -cne $newSha) { throw 'SHORTCUT_CLI_COMMIT_HASH_MISMATCH' }
            if ((Get-FileHash -LiteralPath $backup -Algorithm SHA256).Hash.ToLowerInvariant() -cne $oldSha) { throw 'SHORTCUT_CLI_BACKUP_HASH_MISMATCH' }

            $output = & $probe --shortcut-restore --owner-pid $PID --shortcut $shortcut --backup $backup --quarantine $quarantine --old-sha256 $oldSha --new-sha256 $newSha
            $outputText = [string]($output -join "`n")
            if ($LASTEXITCODE -ne 0 -or -not ($outputText -match 'SHORTCUT_OPERATION_OK --shortcut-restore')) { throw ('SHORTCUT_CLI_RESTORE_FAILED: ' + $outputText) }
            if ((Get-FileHash -LiteralPath $shortcut -Algorithm SHA256).Hash.ToLowerInvariant() -cne $oldSha) { throw 'SHORTCUT_CLI_RESTORE_HASH_MISMATCH' }
            if ((Test-Path -LiteralPath $backup) -or (Test-Path -LiteralPath $quarantine)) { throw 'SHORTCUT_CLI_RESTORE_LEFT_TEMPORARY_FILES' }

            $deletePath = Join-Path $probeDir 'delete-me.lnk'
            [System.IO.File]::WriteAllText($deletePath, 'delete me')
            $deleteSha = (Get-FileHash -LiteralPath $deletePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $output = & $probe --shortcut-delete --owner-pid $PID --path $deletePath --sha256 $deleteSha
            $outputText = [string]($output -join "`n")
            if ($LASTEXITCODE -ne 0 -or -not ($outputText -match 'SHORTCUT_OPERATION_OK --shortcut-delete')) { throw ('SHORTCUT_CLI_DELETE_FAILED: ' + $outputText) }
            if (Test-Path -LiteralPath $deletePath) { throw 'SHORTCUT_CLI_DELETE_DID_NOT_REMOVE_FILE' }

            $protectedPath = Join-Path $probeDir 'wrong-parent.lnk'
            [System.IO.File]::WriteAllText($protectedPath, 'keep me')
            $protectedSha = (Get-FileHash -LiteralPath $protectedPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $output = & $probe --shortcut-delete --owner-pid ($PID + 1) --path $protectedPath --sha256 $protectedSha
            $wrongParentExit = $LASTEXITCODE
            if ($wrongParentExit -eq 0 -or -not (Test-Path -LiteralPath $protectedPath)) { throw 'SHORTCUT_CLI_WRONG_PARENT_GUARD_FAILED' }
            $LASTEXITCODE = 0
            Write-Host 'SHORTCUT_HANDLE_CLI_SMOKE=PASS'
          } finally {
            Remove-Item -LiteralPath $probeDir -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'SHORTCUT_HANDLE_NATIVE_WINDOWS_TESTS=PASS'
          Write-Host 'NOT_RELEASE=true'
          Remove-Item -LiteralPath shortcut-handle-probe.exe -Force
          if (Test-Path -LiteralPath shortcut-handle-probe.exe) { throw 'PROBE_BINARY_CLEANUP_FAILED' }
