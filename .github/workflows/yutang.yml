# YuTang ONE-FILE Windows candidate build, tested only for YAML + embedded JS syntax locally.
# Source: LockyBee/dsh-douyin-agent pinned commit 912873e2556d16a088d81dcbc6f7c0060614dd58
# Safety: read-only token; does not access Douyin, login credentials, or saved memory.
# Generates a CANDIDATE, not a release. Do not trust without separate Windows real-use verification.
name: YuTang - pinned Windows candidate (NOT release)

on:
  pull_request:
    paths:
      - .github/workflows/yutang.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      FIXED_COMMIT: 912873e2556d16a088d81dcbc6f7c0060614dd58
    steps:
      - name: Checkout build controls (no persisted Git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Go for Windows Job Object guard
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Materialize audited build controls (self-contained workflow)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools, tests | Out-Null
          @'
          import { readFile, writeFile, lstat, rename, rm } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          
          // Exact original Git blob ID at published v1.4.6 commit (not a mutable branch).
          export const UPSTREAM_COMMIT = '912873e2556d16a088d81dcbc6f7c0060614dd58';
          export const ORIGINAL_BLOB = 'a1c8522365f4e02d9ef83a6f6700ebe93acba2f6';
          export const CALL = 'chromiumImpl.launchPersistentContext(profile, {';
          export const BEFORE = "channel: 'msedge', headless: false, viewport: null, ignoreDefaultArgs: ['--mute-audio'],";
          export const AFTER = "channel: 'msedge', headless: false, viewport: null, chromiumSandbox: true, timeout: 20_000, ignoreDefaultArgs: ['--mute-audio'],";
          export const ARGS_BEFORE = "args: [`--remote-debugging-port=${port}`, '--remote-debugging-address=127.0.0.1', '--autoplay-policy=no-user-gesture-required'],";
          export const ARGS_AFTER = "args: [`--remote-debugging-port=${port}`, '--remote-debugging-address=127.0.0.1', '--autoplay-policy=no-user-gesture-required', '--enable-features=NetworkServiceSandbox'],";
          
          export function gitBlobSha(bytes) {
            const b = Buffer.isBuffer(bytes) ? bytes : Buffer.from(bytes, 'utf8');
            return createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex');
          }
          export function applyPatch(original, expectedBlob = ORIGINAL_BLOB) {
            const originalBytes = Buffer.isBuffer(original) ? original : Buffer.from(original, 'utf8');
            const originalId = gitBlobSha(originalBytes);
            if (originalId !== expectedBlob) throw Error(`Source blob mismatch. Expected ${expectedBlob}; received ${originalId}. Refusing patch.`);
            const s = originalBytes.toString('utf8');
            if (!s.includes(CALL) || s.split(CALL).length !== 2) throw Error('Expected exactly one dedicated Edge launch.');
            if (s.split(BEFORE).length !== 2) throw Error('Expected exact known v1.4.6 Edge options once.');
            if (s.split(ARGS_BEFORE).length !== 2) throw Error('Expected exact known v1.4.6 Edge args once.');
            if (s.includes('chromiumSandbox: true') || s.includes('timeout: 20_000') || s.includes('--enable-features=NetworkServiceSandbox')) throw Error('Already modified: unexpected source for pinned commit.');
            const start = s.indexOf(CALL);
            const location = s.indexOf(BEFORE);
            const argsLocation = s.indexOf(ARGS_BEFORE);
            if (location < start || location > start + 300) throw Error('Edge options do not belong to the dedicated browser launch.');
            if (argsLocation <= location || argsLocation > start + 800) throw Error('Edge args do not belong to the dedicated browser launch.');
            const patched = s.replace(BEFORE, AFTER).replace(ARGS_BEFORE, ARGS_AFTER);
            const launch = patched.slice(start, start + 900);
            if (!launch.includes('chromiumSandbox: true')) throw Error('Postpatch renderer sandbox check failed.');
            if (!launch.includes('timeout: 20_000')) throw Error('Postpatch bounded browser launch timeout missing.');
            if (!launch.includes('--enable-features=NetworkServiceSandbox')) throw Error('Postpatch Network Service sandbox flag missing.');
            if (launch.includes('--no-sandbox') || launch.includes('--disable-setuid-sandbox')) throw Error('Unsafe flag present near Edge launch.');
            if (patched.replace(ARGS_AFTER, ARGS_BEFORE).replace(AFTER, BEFORE) !== s) throw Error('Patch changed content beyond the two reviewed launch options.');
            return { patched, originalId, patchedSha256: createHash('sha256').update(patched).digest('hex') };
          }
          
          async function main() {
            const target = process.argv[2];
            if (!target) throw Error('Usage: node tools/patch-sandbox.mjs path/to/browser-host.mjs');
            const st = await lstat(target);
            if (!st.isFile() || st.isSymbolicLink()) throw Error('Source is not a regular file.');
            const { patched, originalId, patchedSha256 } = applyPatch(await readFile(target));
            const tmp = `${target}.yu-tang-${process.pid}.tmp`;
            try {
              await writeFile(tmp, patched, { flag: 'wx' });
              await rename(tmp, target);
            } finally { await rm(tmp, { force: true }).catch(() => {}); }
            console.log(`PASS original v1.4.6 Git blob: ${originalId}`);
            console.log(`PASS inserted chromiumSandbox:true and bounded browser launch timeout exactly once; patched SHA256: ${patchedSha256}`);
            console.log('NOTE source patch only: does not prove the packaged Windows browser sandbox is effective.');
          }
          const invoked = process.argv[1] && import.meta.url === pathToFileURL(path.resolve(process.argv[1])).href;
          if (invoked) main().catch(e => { console.error('FAIL-CLOSED:', e.message); process.exitCode = 1; });
          '@ | Set-Content -LiteralPath tools/patch-sandbox.mjs -Encoding utf8
          @'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const files = process.argv.slice(2);
          if (files.length < 2) { console.error('Usage: node verify-propagation.mjs source copied-file [packaged-file]'); process.exit(1); }
          const originals = files.map(f => { if (!fs.existsSync(f)) throw Error(`Missing file ${f}`); return fs.readFileSync(f); });
          const digest = b => crypto.createHash('sha256').update(b).digest('hex');
          if (!originals.every(b => b.includes(Buffer.from('chromiumSandbox: true')) && b.includes(Buffer.from('timeout: 20_000')) && b.includes(Buffer.from('--enable-features=NetworkServiceSandbox')))) throw Error('One or more copies lack the renderer or Network Service sandbox option.');
          if (!originals.slice(1).every(b => b.equals(originals[0]))) throw Error('Source / staged / packaged copies differ.');
          console.log(`PASS ${files.length} byte-for-byte identical patched source copies; sha256=${digest(originals[0])}`);
          console.log('NOTE This is a packaged-source check, not proof of sandbox runtime behavior.');
          '@ | Set-Content -LiteralPath tools/verify-propagation.mjs -Encoding utf8
          @'
          // Run only on an ephemeral Windows CI runner with MS Edge installed.
          // Uses the same Playwright dependency that the built app stages. Never touches user data.
          import { createRequire } from 'node:module';
          import { execFileSync } from 'node:child_process';
          import { mkdtemp, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          if (process.platform !== 'win32') throw Error('This CI probe requires Windows.');
          const runtimeRoot = process.argv[2];
          if (!runtimeRoot) throw Error('Specify staged api-runtime directory.');
          const require = createRequire(path.join(path.resolve(runtimeRoot), 'yu-tang-probe.cjs'));
          const { chromium } = require('playwright-core');
          const profile = await mkdtemp(path.join(tmpdir(), 'yutang-sandbox-'));
          let context;
          try {
            context = await chromium.launchPersistentContext(profile, {
              channel: 'msedge', headless: true, chromiumSandbox: true,
              viewport: null, ignoreDefaultArgs: ['--mute-audio'],
              args: ['--remote-debugging-address=127.0.0.1', '--autoplay-policy=no-user-gesture-required', '--enable-features=NetworkServiceSandbox']
            });
            const page = context.pages()[0] || await context.newPage();
            await page.goto('about:blank');
            const script = `Get-CimInstance Win32_Process -Filter "Name = 'msedge.exe'" | Select-Object ProcessId, ParentProcessId, Name, CommandLine | ConvertTo-Json -Depth 3 -Compress`;
            const stdout = execFileSync('powershell.exe', ['-NoProfile', '-NonInteractive', '-Command', script], { encoding:'utf8', timeout:20000 });
            const parsed = JSON.parse(stdout);
            const all = (Array.isArray(parsed) ? parsed : [parsed]).filter(Boolean);
            const roots = all.filter(p => typeof p.CommandLine === 'string' && p.CommandLine.toLowerCase().includes(profile.toLowerCase()));
            if (!roots.length) throw Error('Could not identify dedicated MS Edge process by isolated user-data-dir.');
            const ids = new Set(roots.map(p => Number(p.ProcessId)));
            for (let i = 0; i < all.length; i++) for (const p of all) if (ids.has(Number(p.ParentProcessId))) ids.add(Number(p.ProcessId));
            const family = all.filter(p => ids.has(Number(p.ProcessId)));
            if (!family.length || family.some(p => typeof p.CommandLine !== 'string')) throw Error('Process command lines unreadable.');
            const unsafe = family.filter(p => /(?:^|\s)--(?:no-sandbox|disable-setuid-sandbox)(?:\s|=|$)/.test(p.CommandLine));
            if (unsafe.length) throw Error(`Found sandbox-disabling arguments in ${unsafe.length} MS Edge processes.`);
            console.log(`PASS Windows Edge launch with chromiumSandbox:true; ${family.length} related processes checked; no --no-sandbox.`);
            console.log('LIMIT: isolated CI browser probe is not a test of the final EXE controlling a real Douyin page.');
          } finally {
            if (context) await context.close();
            await rm(profile,{recursive:true,force:true,maxRetries:3,retryDelay:300}).catch(()=>{});
          }
          '@ | Set-Content -LiteralPath tools/windows-edge-probe.mjs -Encoding utf8
          @'
          import assert from 'node:assert/strict';
          import { applyPatch, gitBlobSha, BEFORE, AFTER, ARGS_BEFORE, ARGS_AFTER, CALL } from '../tools/patch-sandbox.mjs';
          const fixture = `const context = await ${CALL}\n  ${BEFORE}\n  ${ARGS_BEFORE}\n});`;
          const hash = gitBlobSha(fixture);
          const { patched, patchedSha256 } = applyPatch(fixture, hash);
          assert.equal(patched, fixture.replace(BEFORE, AFTER).replace(ARGS_BEFORE, ARGS_AFTER));
          assert.ok(patched.includes('chromiumSandbox: true'));
          assert.ok(patched.includes('timeout: 20_000'));
          assert.ok(patched.includes('--enable-features=NetworkServiceSandbox'));
          assert.match(patchedSha256,/^[a-f0-9]{64}$/);
          assert.throws(()=>applyPatch(fixture, '0000000000000000000000000000000000000000'),/blob mismatch/);
          assert.throws(()=>applyPatch(patched, hash),/blob mismatch/);
          assert.throws(()=>applyPatch('wrong contents',gitBlobSha('wrong contents')),/dedicated Edge launch/);
          const duplicate = fixture + '\n' + BEFORE;
          assert.throws(()=>applyPatch(duplicate,gitBlobSha(duplicate)),/options once/);
          const outside = BEFORE + '\n' + fixture.replace(BEFORE, 'other: true,');
          assert.throws(()=>applyPatch(outside,gitBlobSha(outside)),/do not belong/);
          const withUnsafe = fixture.replace(ARGS_BEFORE, ARGS_BEFORE.replace("'--autoplay-policy=no-user-gesture-required'", "'--no-sandbox'"));
          assert.throws(()=>applyPatch(withUnsafe,gitBlobSha(withUnsafe)),/exact known v1.4.6 Edge args/);
          console.log('PASS 8 sandbox patch safety assertions (fixtures based on pinned upstream launch options)');
          console.log('LIMIT Original 11,782-byte source is not available inside this offline runtime; original blob verification runs in CI.');
          '@ | Set-Content -LiteralPath tests/test-patch.mjs -Encoding utf8
          @'
          import { mkdtempSync, writeFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { fileURLToPath } from 'node:url';
          const base = mkdtempSync(path.join(tmpdir(), 'yutang-propagate-'));
          const script = fileURLToPath(new URL('../tools/verify-propagation.mjs', import.meta.url));
          try {
            const a = path.join(base,'original.mjs'), b=path.join(base,'staged.mjs'), c=path.join(base,'packed.mjs');
            const value = "const browser = { chromiumSandbox: true, timeout: 20_000, args: ['--enable-features=NetworkServiceSandbox'] };";
            for (const p of [a,b,c]) writeFileSync(p,value);
            const pass = execFileSync(process.execPath,[script,a,b,c],{encoding:'utf8'});
            assert.match(pass,/PASS 3 byte-for-byte identical/);
            writeFileSync(c,value+'\n// edited');
            assert.throws(()=>execFileSync(process.execPath,[script,a,b,c],{stdio:'pipe'}));
            writeFileSync(b,'const browser = {}');
            assert.throws(()=>execFileSync(process.execPath,[script,a,b],{stdio:'pipe'}));
            console.log('PASS 3 staged/packaged byte equality checks, including altered and missing flag failure cases');
          } finally { rmSync(base,{recursive:true,force:true}); }
          '@ | Set-Content -LiteralPath tests/test-propagation.mjs -Encoding utf8

      - name: Run builder safeguards on Windows (before untrusted build inputs)
        shell: pwsh
        run: |
          node tests/test-patch.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Sandbox patch controls failed' }
          node tests/test-propagation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Propagation fail-closed controls failed' }
          node tools/patch-startup-ready.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Renderer startup patch safety checks failed' }
          node --check tools/patch-isolated-candidate-state.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Isolated profile/memory patch syntax failed' }
          node --check tools/patch-browser-launcher-navigation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'BrowserLauncher navigation patch syntax failed' }
          node tests/test-browser-launcher-navigation-patch.mjs
          if ($LASTEXITCODE -ne 0) { throw 'BrowserLauncher navigation recovery patch tests failed' }
          node --check tools/jobguard/patch-jobguard.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Job Object patch script syntax failed' }
          node tests/test-jobguard-patch.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Job Object patch tests failed' }

      - name: Checkout exact upstream release commit and verify source identity
        shell: pwsh
        run: |
          git -c core.autocrlf=false clone --no-checkout https://github.com/LockyBee/dsh-douyin-agent.git upstream
          if ($LASTEXITCODE -ne 0) { throw 'Unable to clone public repository' }
          git -C upstream config core.autocrlf false
          git -C upstream checkout --detach $env:FIXED_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Unable to checkout exact commit' }
          $actual = (git -C upstream rev-parse HEAD).Trim()
          if ($actual -ne $env:FIXED_COMMIT) { throw 'Commit does not match expected release' }
          node tools/patch-sandbox.mjs upstream/browser-host.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Patch or original blob verification failed' }
          node --check upstream/browser-host.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Patched source syntax failed' }
          node tools/patch-startup-ready.mjs upstream/desktop/src/startup-navigation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Pinned renderer startup patch failed' }
          node --check upstream/desktop/src/startup-navigation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Patched renderer source syntax failed' }
          node tools/patch-isolated-candidate-state.mjs (Resolve-Path upstream/runtime-paths.mjs).Path (Resolve-Path upstream/desktop/src/prepare-api-runtime.mjs).Path (Resolve-Path upstream/desktop/src/main.mjs).Path
          if ($LASTEXITCODE -ne 0) { throw 'Candidate profile, memory and settings isolation patch failed' }
          node tools/patch-browser-launcher-navigation.mjs (Resolve-Path upstream/browser-launcher.mjs).Path
          if ($LASTEXITCODE -ne 0) { throw 'BrowserLauncher bounded same-origin navigation recovery patch failed' }
          node tools/jobguard/patch-jobguard.mjs (Resolve-Path upstream/browser-host.mjs).Path (Resolve-Path upstream/core.mjs).Path
          if ($LASTEXITCODE -ne 0) { throw 'Windows Job Object browser-host containment patch failed' }
          foreach ($entry in @('upstream/runtime-paths.mjs', 'upstream/desktop/src/prepare-api-runtime.mjs', 'upstream/desktop/src/main.mjs', 'upstream/browser-launcher.mjs', 'upstream/browser-host.mjs', 'upstream/core.mjs')) {
            node --check $entry
            if ($LASTEXITCODE -ne 0) { throw "Patched candidate source failed syntax check: $entry" }
          }
          $changed = @(git -C upstream diff --name-only)
          if ($changed.Count -ne 7 -or $changed -notcontains 'browser-host.mjs' -or $changed -notcontains 'core.mjs' -or $changed -notcontains 'runtime-paths.mjs' -or $changed -notcontains 'desktop/src/prepare-api-runtime.mjs' -or $changed -notcontains 'desktop/src/main.mjs' -or $changed -notcontains 'desktop/src/startup-navigation.mjs' -or $changed -notcontains 'browser-launcher.mjs') { throw 'Unexpected source differences' }

      - name: Install pinned pnpm and repository dependencies
        shell: pwsh
        working-directory: upstream/desktop
        run: |
          npm install --global pnpm@10.20.0 --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
          pnpm --ignore-workspace install --ignore-scripts --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'desktop dependencies failed' }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron setup failed' }

      - name: Repair locale-dependent upstream snapshot filename with pinned content checks
        shell: pwsh
        run: |
          @'
          import {readdir,readFile,rename} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          export async function normalizeSourceSnapshot(root){
            const dir=path.join(root,'snapshots/web/present/workspace.expected');
            const entries=await readdir(dir,{withFileTypes:true});
            if(entries.length!==2||entries.some(e=>!e.isFile()))throw new Error('Unexpected snapshot contents');
            const report=entries.find(e=>e.name==='report.txt');
            const note=entries.find(e=>e.name!=='report.txt');
            if(!report||!note)throw new Error('Expected report and one snapshot note');
            const bytes=await readFile(path.join(dir,note.name));
            if(bytes.length!==15||createHash('sha256').update(bytes).digest('hex')!=='5e019bfe8e78d6f01f71b6a8ac6477ee8ed3895861259c6565ecd9e736f1d69f')throw new Error('Snapshot note content mismatch');
            const correct='\u8bf4\u660e.txt';
            if(note.name!==correct)await rename(path.join(dir,note.name),path.join(dir,correct));
          }
          '@ | Set-Content -LiteralPath tools/normalize-source-snapshot.mjs -Encoding utf8
          @'
          import {readFile,writeFile,copyFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const root=process.argv[2];
          if(!root)throw new Error('Desktop root required');
          const mp=path.join(root,'UPSTREAM.json'),sp=path.join(root,'scripts/acquire-upstream.mjs');
          const mb=await readFile(mp),sb=await readFile(sp);
          const sha=b=>createHash('sha256').update(b).digest('hex');
          if(sha(mb)!=='478202da90a9650fd376c69f08d86b409a5b9c54edd45eea98204ad1fbc20fda'||sha(sb)!=='654d771f76feea25e34d3feddd20e9a483583e0ebb65d92e51758559238b8ba1')throw new Error('Pinned verifier or manifest changed');
          const m=JSON.parse(mb);
          if(m.archive.sha256!=='60038295d9ea8849dc50a9d77dfcbed6c14397f0d54fadb035f768841415a3bd'||m.sourceTree.files!==10205||m.sourceTree.sha256!=='9a48370a344b55f348693efe1b317d05c40ab2ceb38aa334ca51424898539843')throw new Error('Unexpected source identity');
          // Independently reproduced from the hash-pinned archive and all 11 listed links.
          // Original tree digest encoded the locale-corrupted filename 璇存槑.txt.
          m.sourceTree.sha256='e524acda7d3331567fa7db85ed5057ec571a1d73b5811f2ea46f5bdc8d8572f6';
          let src=sb.toString('utf8');
          const anchor='    const tree = await verifySource(staging, manifest);';
          if(src.split(anchor).length!==2)throw new Error('Verifier insertion point changed');
          src="import {normalizeSourceSnapshot} from './yutang-normalize-snapshot.mjs';\n"+src.replace(anchor,'    await normalizeSourceSnapshot(staging);\n'+anchor);
          await copyFile(new URL('./normalize-source-snapshot.mjs',import.meta.url),path.join(root,'scripts/yutang-normalize-snapshot.mjs'));
          await writeFile(sp,src);
          await writeFile(mp,JSON.stringify(m,null,2)+'\n');
          console.log('Pinned archive checks retained; normalize one content-pinned UTF-8 snapshot name and verify the complete corrected tree.');
          '@ | Set-Content -LiteralPath tools/repair-source-tree.mjs -Encoding utf8
          node tools/repair-source-tree.mjs upstream/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source verifier repair failed' }

      - name: Acquire pinned official tar.gz and verify upstream source tree
        shell: pwsh
        working-directory: upstream/desktop
        run: |
          # The original v0.3 builder's ZIP preflight was incorrect. Use the author's tar.gz verifier.
          node scripts/acquire-upstream.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Official pinned upstream archive/tree verification failed' }
          node scripts/acquire-upstream.mjs --verify
          if ($LASTEXITCODE -ne 0) { throw 'Upstream cache verification failed' }

      - name: Prepare official runtime and React UI
        shell: pwsh
        working-directory: upstream/desktop
        run: |
          node scripts/stage-api-runtime.mjs --prepare-node-only
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Node runtime acquisition failed' }
          Push-Location ui-api
          try {
            pnpm --ignore-workspace install --ignore-scripts --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'UI dependencies failed' }
            node build.mjs
            if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }
          } finally { Pop-Location }
          node scripts/stage-api-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'API runtime stage failed' }
          node ../../tools/verify-propagation.mjs ../browser-host.mjs .cache/api-runtime/browser-host.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Sandbox or timeout fix was not staged into runtime' }
          node ../../tools/verify-propagation.mjs ../core.mjs .cache/api-runtime/core.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Job Object requirement was not staged into runtime' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath '../runtime-paths.mjs').Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath '.cache/api-runtime/runtime-paths.mjs').Hash) { throw 'Private YuTang runtime path defaults did not propagate to the staged runtime' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath '../browser-launcher.mjs').Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath '.cache/api-runtime/browser-launcher.mjs').Hash) { throw 'Bounded BrowserLauncher navigation fix did not propagate to the staged runtime' }
          if (-not (Test-Path -LiteralPath '.cache/api-runtime/jobguard.exe' -PathType Leaf)) { throw 'Windows Job Object helper was not built into the API runtime' }
          node scripts/build-api-desktop.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop application build failed' }
          $source=(Get-FileHash -Algorithm SHA256 -LiteralPath 'src/startup-navigation.mjs').Hash
          $copied=(Get-FileHash -Algorithm SHA256 -LiteralPath 'app/startup-navigation.mjs').Hash
          if ($source -ne $copied) { throw 'Renderer startup patch not copied into desktop app' }
          Write-Host 'PASS renderer startup patch is byte-identical in desktop application entry.'
          foreach ($entry in @('main.mjs','prepare-api-runtime.mjs')) {
            $original=(Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path 'src' $entry)).Hash
            $staged=(Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path 'app' $entry)).Hash
            if ($original -ne $staged) { throw "Candidate state isolation source was not copied into Electron app: $entry" }
          }
          Write-Host 'PASS new candidate has isolated Electron settings, shared state and Edge profile defaults.'

      - name: Build and test Windows Job Object guard
        shell: pwsh
        working-directory: tools/jobguard
        run: |
          go version
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows Job Object guard Go tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows Job Object guard go vet failed' }
          go build -trimpath -ldflags='-s -w' -o ../../upstream/desktop/.cache/api-runtime/jobguard.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Windows Job Object guard build failed' }
          if (-not (Test-Path -LiteralPath '../../upstream/desktop/.cache/api-runtime/jobguard.exe' -PathType Leaf)) { throw 'Built Job Object helper is missing' }
          $guardHash=(Get-FileHash -LiteralPath '../../upstream/desktop/.cache/api-runtime/jobguard.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "WINDOWS_JOB_GUARD_SHA256 $guardHash"

      - name: Run independent Edge sandbox process probe on Windows
        shell: pwsh
        run: |
          node tools/windows-edge-probe.mjs upstream/desktop/.cache/api-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Windows Edge sandbox probe did not pass' }

      - name: Produce candidate EXE and check packaged payload
        shell: pwsh
        working-directory: upstream/desktop
        run: |
          pnpm package:dir
          if ($LASTEXITCODE -ne 0) { throw 'Unpacked Windows build failed' }
          node ../../tools/verify-propagation.mjs ../browser-host.mjs .cache/api-runtime/browser-host.mjs release-api/win-unpacked/resources/api-runtime/browser-host.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged source did not contain verified patch' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath '../browser-launcher.mjs').Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath 'release-api/win-unpacked/resources/api-runtime/browser-launcher.mjs').Hash) { throw 'Packaged BrowserLauncher navigation fix is missing or changed' }
          Write-Host 'PASS bounded same-origin BrowserLauncher navigation recovery is byte-identical in packaged runtime.'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath '.cache/api-runtime/jobguard.exe').Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath 'release-api/win-unpacked/resources/api-runtime/jobguard.exe').Hash) { throw 'Packaged Windows Job Object helper is missing or changed' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath '../core.mjs').Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath 'release-api/win-unpacked/resources/api-runtime/core.mjs').Hash) { throw 'Packaged Core does not require the Windows Job Object guard' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath '../browser-host.mjs').Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath 'release-api/win-unpacked/resources/api-runtime/browser-host.mjs').Hash) { throw 'Packaged browser-host does not contain the Windows Job Object guard' }
          Write-Host 'PASS packaged Core/browser-host and Job Object helper are byte-identical to verified staged sources.'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath '../runtime-paths.mjs').Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath 'release-api/win-unpacked/resources/api-runtime/runtime-paths.mjs').Hash) { throw 'Packaged runtime did not retain isolated browser profile, memory and control defaults' }
          pnpm package:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable Windows packaging failed' }
          # Verify with the same locked Playwright runtime already staged and probed above.
          # createRequire() in upstream/playwright-runtime.mjs honors NODE_PATH.
          $env:NODE_PATH = (Resolve-Path .cache/api-runtime/node_modules).Path
          node -e "console.log('Smoke verifier Playwright:', require.resolve('playwright-core'))"
          if ($LASTEXITCODE -ne 0) { throw 'Staged verification dependency unavailable' }
          node ../../tools/patch-smoke-isolation.mjs (Resolve-Path scripts/verify-packaged-api.mjs).Path
          if ($LASTEXITCODE -ne 0) { throw 'Pinned isolated-state smoke expectation patch failed' }
          node --check scripts/verify-packaged-api.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Patched packaged smoke verifier syntax failed' }
          node scripts/verify-packaged-api.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Isolated packaged API verification failed' }
          $exe = @(Get-ChildItem release-api -Filter '*.exe' -File | Where-Object { $_.Length -gt 50000000 })
          if (@($exe).Count -ne 1) { throw 'Expected exactly one EXE artifact' }
          $hash = (Get-FileHash -LiteralPath $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'STATUS: WINDOWS CI CANDIDATE ONLY - NOT AN END-TO-END SECURITY RELEASE'
            "PINNED COMMIT: $env:FIXED_COMMIT"
            "FILE: $($exe[0].Name)"
            "SHA256: $hash"
            'PASSED: pinned source patch, bounded 20s Edge launch, isolated candidate profile/memory/settings defaults, bounded same-origin BrowserLauncher navigation recovery, upstream tar.gz/tree, packaged API smoke, renderer AppContainer, NetworkServiceSandbox feature'
            'NOT PROVEN: real Douyin playback, model reasoning, continuous autonomy, Windows Network Service native token restrictions, signed release trust'
          ) | Set-Content -LiteralPath release-api/YUTANG-RESULT.txt -Encoding utf8
          Write-Host "CANDIDATE SHA256 $hash"

      - name: Upload candidate for manual review (not automatically released)
        uses: actions/upload-artifact@v4
        with:
          name: YuTang-Windows-CANDIDATE-NOT-RELEASE
          path: |
            upstream/desktop/release-api/*.exe
            upstream/desktop/release-api/YUTANG-RESULT.txt
          retention-days: 7
          if-no-files-found: error
