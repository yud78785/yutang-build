# ONE-SHOT RUN AUTHORIZED BY USER on 2026-11-17.
# This workflow tests only the original immutable unsigned EXE on Windows 2022.
# It does not rebuild, sign, merge, publish, modify main or run Windows 2025.
# Source and artifact are pinned; subsequent pushes are skipped by the job guard.
# If any acceptance gate fails, do not automatically retry or start another runner.
# Original source Artifact expires 2026-11-21T01:50:44Z.
name: YuTang 1.4.7 exact unsigned EXE public-web Windows 2022 one-shot - NOT RELEASE
on:
  push:
    branches:
      - experiment/windows-147-public-web-2022-one-shot-20261117
    paths:
      - .github/workflows/windows-147-public-web-2022-one-shot.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: yutang-147-public-web-2022-once
  cancel-in-progress: false

jobs:
  public-homepage-2022:
    # Source pin and one nonforced, nonbranch-creation push only.
    # Subsequent pushes MUST be SKIPPED, not interpreted as PASS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/windows-147-public-web-2022-one-shot-20261117' && github.event.before == 'd523b38f8eee385fce7587b6fd0a7c639da3c721' && github.event.created == false && github.event.forced == false && github.event.deleted == false
    name: Windows 2022 identical EXE public homepage and strict cleanup
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact previously reviewed probe code without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d523b38f8eee385fce7587b6fd0a7c639da3c721
          persist-credentials: false

      - name: Fail if source checkout changed
        shell: pwsh
        run: |
          if ((& git rev-parse HEAD).Trim() -cne 'd523b38f8eee385fce7587b6fd0a7c639da3c721') {
            throw 'PUBLIC_WEB_PROBE_SOURCE_SHA_MISMATCH'
          }

      - name: Use pinned Node.js matching the passing Windows 2025 online probe
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4

      - name: Verify source run and Artifact metadata before download
        shell: pwsh
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_READ_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $run = Invoke-RestMethod -Uri 'https://api.github.com/repos/yud78785/yutang-build/actions/runs/43541915930' -Headers $headers -TimeoutSec 20
          if ($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or
              $run.head_sha -cne '9cc16d7e64d59dc141e9c6687b8dd461934fcc35') {
            throw 'SOURCE_RUN_IDENTITY_MISMATCH'
          }
          $archiveList = Invoke-RestMethod -Uri 'https://api.github.com/repos/yud78785/yutang-build/actions/runs/43541915930/artifacts?per_page=100' -Headers $headers -TimeoutSec 20
          $matchingArtifacts = @($archiveList.artifacts | Where-Object { [string]$_.id -ceq '14092434238' })
          if ($matchingArtifacts.Count -ne 1) { throw 'SOURCE_ARTIFACT_ID_MISMATCH' }
          $artifact = $matchingArtifacts[0]
          if ($artifact.name -cne 'YuTang-OpenRouter-Desktop-1.4.7-SecurityHardening-windows-2025-CANDIDATE-NOT-RELEASE' -or
              [long]$artifact.size_in_bytes -ne 125575315 -or
              $artifact.digest -cne 'sha256:718d52af838a4fa0c375ae51f0b1f71aa2dc20d3615b58f79f7355ca1bf3342a' -or
              $artifact.expired -ne $false -or
              [string]$artifact.workflow_run.id -cne '43541915930' -or
              $artifact.workflow_run.head_sha -cne '9cc16d7e64d59dc141e9c6687b8dd461934fcc35') {
            throw 'SOURCE_ARTIFACT_PROVENANCE_MISMATCH'
          }
          Write-Host 'SOURCE_ARTIFACT_METADATA_VERIFIED'

      - name: Download EXACT same already accepted Windows 2025 EXE
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: yud78785/yutang-build
          run-id: 43541915930
          name: YuTang-OpenRouter-Desktop-1.4.7-SecurityHardening-windows-2025-CANDIDATE-NOT-RELEASE
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/yutang-147-accepted-exe

      - name: Verify exact EXE pathname, bytes and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path '${{ runner.temp }}' 'yutang-147-accepted-exe\desktop\release-api\Dafeiyu-Douyin-API-1.4.7-win-x64.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'ACCEPTED_EXE_NOT_FOUND' }
          if ((Get-Item -LiteralPath $exe).Length -ne 125446071) { throw 'ACCEPTED_EXE_SIZE_MISMATCH' }
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -cne '3201d433df727a5d5fddf8e68a0f69ea1654057e04cfad7833fd3ed7dc241a34') {
            throw 'ACCEPTED_EXE_SHA256_MISMATCH'
          }
          ('YUTANG_ACCEPTED_EXE=' + $exe) | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ('ACCEPTED_EXE_SHA256=' + $sha)

      - name: Run exact fixed source probe-negative unit tests
        shell: pwsh
        run: |
          node --version
          node --test tests/windows147-online-public-probe.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_WEB_PROBE_NEGATIVE_TESTS_FAILED' }

      - name: Single authorized Windows 2022 real public-homepage probe, with fail-closed cleanup
        shell: pwsh
        timeout-minutes: 18
        env:
          YUTANG_PUBLIC_WEB_TEST_AUTHORIZED: 'yes'
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-NetFirewallRule -DisplayName 'YuTang147EphemeralEdgeEgressBlock' -ErrorAction SilentlyContinue) {
            throw 'OFFLINE_FIREWALL_RULE_NOT_ALLOWED_DURING_ONLINE_PROBE'
          }
          node tools/windows147-online-public-probe.mjs "$env:YUTANG_ACCEPTED_EXE"
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_WEB_EXE_ACCEPTANCE_NOT_PROVEN' }

# Required PASS on this run's raw logs:
#   WINDOWS_PUBLIC_PAGE_GATE_OK (HTTP 200 + rendered true)
#   WINDOWS_PUBLIC_WEB_CLEANUP_OK (0 owned processes/CDP + directories removed)
#   WINDOWS_PUBLIC_WEB_EXE_RECEIPT status=PASS_WINDOWS_EXE_PUBLIC_WEB_ONLY
#   exact exeSha256=3201d433df727a5d5fddf8e68a0f69ea1654057e04cfad7833fd3ed7dc241a34
# If any is absent, result is FAIL/UNVERIFIED; no second attempt automatically.
