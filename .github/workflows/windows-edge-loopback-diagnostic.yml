name: Microsoft Edge localhost CDP diagnostic (no candidate EXE)

on:
  pull_request:
    paths:
      - .github/workflows/windows-edge-loopback-diagnostic.yml

permissions:
  contents: read

jobs:
  signed-edge-loopback:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Verify signed Edge, block all Edge outbound traffic, test isolated headless localhost CDP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@(
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          )
          $found=@($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if($found.Count -ne 1) { throw 'No single known signed Edge installed' }
          $sign=Get-AuthenticodeSignature -LiteralPath $found[0]
          if($sign.Status -ne 'Valid') { throw 'Edge is not validly signed; refusing launch' }
          $rule=New-NetFirewallRule -DisplayName 'YuTangEphemeralEdgeLoopbackDiagnostics' -Direction Outbound -Program $found[0] -Action Block -Profile Any -ErrorAction Stop
          if($rule.Enabled -ne 'True' -or $rule.Action -ne 'Block') { throw 'Firewall block unproven' }
          $profile=Join-Path $env:RUNNER_TEMP ('yutang-signed-edge-no-account-'+[guid]::NewGuid().ToString('N'))
          [void][System.IO.Directory]::CreateDirectory($profile)
          $started=$null
          try {
            $arguments=@('--headless=new','--no-first-run','--remote-debugging-address=127.0.0.1','--remote-debugging-port=9228',("--user-data-dir=$profile"),'about:blank')
            $started=Start-Process -FilePath $found[0] -ArgumentList $arguments -PassThru -WindowStyle Hidden
            if (-not $started) { throw 'Signed Edge process did not launch' }
            $deadline=[DateTime]::UtcNow.AddSeconds(25)
            $browser=$null
            while([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 500
              try { $browser=Invoke-RestMethod -Uri 'http://127.0.0.1:9228/json/version' -TimeoutSec 2 -ErrorAction Stop; if($browser.Browser -match 'Edg|Chrome') { break } }
              catch { $browser=$null }
            }
            if (-not $browser -or $browser.Browser -notmatch 'Edg|Chrome') { throw 'Loopback CDP unavailable under outbound block; do not infer GUI candidate defect' }
            $listeners=@(Get-NetTCPConnection -LocalPort 9228 -State Listen -ErrorAction Stop)
            if (-not $listeners.Count -or @($listeners | Where-Object { $_.LocalAddress -notin @('127.0.0.1','::1') }).Count -gt 0) { throw 'Unexpected Edge CDP address' }
            Write-Host "LOOPBACK_CDP_PROBE: PASS; signed Edge, outbound firewall block active, localhost CDP responding, listeners=$($listeners.Count)."
            Write-Host 'LIMIT: This proves only an independent HEADLESS Microsoft-signed Edge probe; not packaged YuTang GUI Edge.'
          } finally {
            if ($started -and -not $started.HasExited) { try { Stop-Process -Id $started.Id -Force -ErrorAction Stop } catch {} }
          }

  signed-edge-headful-control:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Compare HEADED Microsoft-signed Edge under identical outbound restrictions (no candidate EXE)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $choices=@(
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe')
          )
          $edge=@($choices | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if($edge.Count -ne 1) { throw 'Expected exactly one installed Edge' }
          if((Get-AuthenticodeSignature -LiteralPath $edge[0]).Status -ne 'Valid') { throw 'Edge signature invalid' }
          $rule=New-NetFirewallRule -DisplayName 'YuTangHeadfulEdgeCIBlock' -Direction Outbound -Program $edge[0] -Action Block -Profile Any -ErrorAction Stop
          if($rule.Enabled -ne 'True' -or $rule.Action -ne 'Block') { throw 'Outbound firewall rule not proven' }
          $profile=Join-Path $env:RUNNER_TEMP ('yutang-headed-edge-no-account-'+[guid]::NewGuid().ToString('N'))
          [void][System.IO.Directory]::CreateDirectory($profile)
          $started=$null
          try {
            $args=@('--no-first-run','--remote-debugging-address=127.0.0.1','--remote-debugging-port=9229',("--user-data-dir=$profile"),'about:blank')
            $started=Start-Process -FilePath $edge[0] -ArgumentList $args -PassThru -WindowStyle Hidden
            if(-not $started) { throw 'Signed headed Edge did not launch' }
            $deadline=[DateTime]::UtcNow.AddSeconds(25)
            $browser=$null
            while([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 500
              try {
                $browser=Invoke-RestMethod -Uri 'http://127.0.0.1:9229/json/version' -TimeoutSec 2 -ErrorAction Stop
                if($browser.Browser -match 'Edg|Chrome') {break}
              } catch { $browser=$null }
            }
            if(-not $browser -or $browser.Browser -notmatch 'Edg|Chrome') {
              Write-Host 'HEADED_EDGE_CONTROL: FAIL_CLOSED; Edge with GUI cannot establish CDP in this hosted runner with outbound block'
              throw 'Cannot use this Windows runner as proof of packaged HEADFUL Edge behavior'
            }
            $listener=@(Get-NetTCPConnection -LocalPort 9229 -State Listen -ErrorAction Stop)
            if(-not $listener.Count -or @($listener | Where-Object { $_.LocalAddress -notin @('127.0.0.1','::1') }).Count -gt 0) { throw 'Headed Edge port not exclusively loopback' }
            Write-Host "HEADED_EDGE_CONTROL: PASS; signed headed Edge, outbound blocked, localhost CDP listening; listenerCount=$($listener.Count)."
            Write-Host 'LIMIT: This control is Edge alone, not the YuTang candidate EXE.'
          } finally {
            if($started -and -not $started.HasExited) {try { Stop-Process -Id $started.Id -Force -ErrorAction Stop } catch {}}
          }
