name: YuTang actual-W3C-evidence MCP query - NOT full video inference

on:
  push:
    branches:
      - experiment/video-component-pilot-20261113
    paths:
      - .github/workflows/readonly-evidence-replay.yml
      - tools/verify_readonly_real_evidence.py

concurrency:
  group: yutang-actual-manifest-readonly-mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  pinned-real-manifest-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Enforce disposable Linux and read-only evidence identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yud78785/yutang-build"
          test "$GITHUB_REF" = "refs/heads/experiment/video-component-pilot-20261113"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$RUNNER_OS" = "Linux"
          echo "No Windows EXE, media downloader, user PC or paid AI provider"
      - name: Checkout tested adapter only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Load original SHA-bound real-media run artifact (no video reprocessing)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/verified-evidence
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 45 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/yud78785/yutang-build/actions/artifacts/13999042019/zip" \
            -o work/pinned-real-av.zip
          printf 'f4709d4d318f4d10218b0895e348ba61c72e2a9430d3defbcf592b2bf827afea  work/pinned-real-av.zip\n' | sha256sum -c
          test "$(unzip -Z1 work/pinned-real-av.zip | grep -xc 'pilot-manifest.json')" -eq 1
          unzip -p work/pinned-real-av.zip pilot-manifest.json > work/verified-evidence/pilot-manifest.json
          test -s work/verified-evidence/pilot-manifest.json
          echo "Original exact completed/success media job 43340305925, artifact 13999042019 and ZIP hash verified"
      - name: Test actual timestamped subtitle and frame-proof MCP transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir "fastmcp==3.4.5"
          .venv/bin/python -m py_compile tools/readonly_video_mcp.py tools/verify_readonly_real_evidence.py
          .venv/bin/python tools/verify_readonly_real_evidence.py
      - name: Keep minimal real-evidence MCP query receipt, no transcript/video/images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: YuTang-Real-Manifest-To-ReadOnly-MCP-NOT-VIDEO-OR-EXE
          path: work/verified-evidence/mcp-query-verdict.json
          if-no-files-found: warn
          retention-days: 7
