name: YuTang original Windows Douyin JPEG -> read-only MCP image - not new EXE

on:
  push:
    branches:
      - experiment/video-component-pilot-20261113
    paths:
      - .github/workflows/readonly-original-windows-jpeg.yml
      - tools/verify_original_windows_frames_mcp.py

concurrency:
  group: yutang-original-windows-frames-mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  original-windows-jpeg-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Safety gate, no new Windows or Douyin browser
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yud78785/yutang-build"
          test "$GITHUB_REF" = "refs/heads/experiment/video-component-pilot-20261113"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$RUNNER_OS" = "Linux"
          echo "Replays accepted prior Windows JPEG artifacts only; no new user PC or Windows EXE run"
      - name: Checkout pinned reviewed prototype without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download original true Windows video frames, verify immutable original artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/browser-frame-evidence
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 40 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/yud78785/yutang-build/actions/artifacts/13951609541/zip" \
            -o work/original-Windows-3-JPEG.zip
          printf '5b2f2432a25ef6e2581be64eb58c352652d39b245d1a0036682e39e7acac3849  work/original-Windows-3-JPEG.zip\n' | sha256sum -c
          echo "Exact original Windows capture ZIP checked; source run 43233257378"
      - name: Send original JPEG bytes through actual restricted FastMCP ImageContent
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir "fastmcp==3.4.5"
          .venv/bin/python -m py_compile tools/readonly_video_mcp.py tools/verify_original_windows_frames_mcp.py
          .venv/bin/python -m tools.verify_original_windows_frames_mcp
      - name: Preserve only hashes/receipt, never republish copyrighted raw frames
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: YuTang-Original-Windows-JPEG-MCP-Transport-NOT-VIDEO-SEMANTICS
          path: work/browser-frame-evidence/mcp-image-verdict.json
          if-no-files-found: warn
          retention-days: 7
