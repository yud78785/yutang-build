name: Node 24 Edge Network Service sandbox A/B (no accounts)

on:
  push:
    branches:
      - audit/node24-edge-host-20261111
    paths:
      - tools/node24_network_service_sandbox_probe.mjs
      - .github/workflows/node24-network-service-sandbox.yml
  pull_request:
    paths:
      - tools/node24_network_service_sandbox_probe.mjs
      - .github/workflows/node24-network-service-sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-service-sandbox-ab:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Stage the exact candidate Node 24 and locked Playwright runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git -c core.autocrlf=false clone --no-checkout https://github.com/LockyBee/dsh-douyin-agent.git upstream
          if($LASTEXITCODE -ne 0) { throw 'Pinned upstream clone failed' }
          git -C upstream config core.autocrlf false
          git -C upstream checkout --detach 912873e2556d16a088d81dcbc6f7c0060614dd58
          if($LASTEXITCODE -ne 0) { throw 'Pinned upstream checkout failed' }
          $actual=(git -C upstream rev-parse HEAD).Trim()
          if($actual -ne '912873e2556d16a088d81dcbc6f7c0060614dd58') { throw 'Upstream source identity mismatch' }
          node --check tools/patch_candidate_browser_host.mjs
          if($LASTEXITCODE -ne 0) { throw 'Sandbox patch helper syntax failed' }
          node tools/patch_candidate_browser_host.mjs upstream/browser-host.mjs
          if($LASTEXITCODE -ne 0) { throw 'Exact candidate renderer sandbox patch failed' }
          npm install --global pnpm@10.20.0 --no-fund --no-audit
          if($LASTEXITCODE -ne 0) { throw 'Pinned pnpm installation failed' }
          Push-Location upstream/desktop
          try {
            pnpm --ignore-workspace install --ignore-scripts --frozen-lockfile
            if($LASTEXITCODE -ne 0) { throw 'Frozen desktop dependency installation failed' }
            node scripts/stage-api-runtime.mjs --prepare-node-only
            if($LASTEXITCODE -ne 0) { throw 'Exact Node 24 runtime preparation failed' }
            node scripts/stage-api-runtime.mjs --allow-missing-ui
            if($LASTEXITCODE -ne 0) { throw 'Pure API runtime staging failed' }
          } finally { Pop-Location }
          $runtime=(Resolve-Path 'upstream/desktop/.cache/api-runtime').Path
          $node=(Resolve-Path 'upstream/desktop/.cache/generated/node/node.exe').Path
          $hostFile=Join-Path $runtime 'browser-host.mjs'
          $hostHash=(Get-FileHash -LiteralPath $hostFile -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hostHash -ne '5716a705e19663f1f6faed52569508b72cf091d3a31766828a7a5434a6eca1bc') { throw "Candidate browser-host patch hash mismatch: $hostHash" }
          "YUTANG_RUNTIME=$runtime" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "YUTANG_NODE=$node" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          & $node -p "process.versions.node"
          if($LASTEXITCODE -ne 0) { throw 'Bundled Node runtime could not execute' }
          & $node --check 'tools/node24_network_service_sandbox_probe.mjs'
          if($LASTEXITCODE -ne 0) { throw 'Network Service sandbox probe syntax failed' }

      - name: Verify Edge signature and block all outbound Edge traffic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@(
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe')
          )
          $edge=@($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if($edge.Count -ne 1) { throw 'Expected exactly one Microsoft Edge binary' }
          if((Get-AuthenticodeSignature -LiteralPath $edge[0]).Status -ne 'Valid') { throw 'Microsoft Edge signature verification failed' }
          $rule=New-NetFirewallRule -DisplayName 'YuTangNetworkSandboxProbeBlockOutbound' -Direction Outbound -Program $edge[0] -Action Block -Profile Any -ErrorAction Stop
          if($rule.Enabled -ne 'True' -or $rule.Action -ne 'Block' -or $rule.Direction -ne 'Outbound') { throw 'Edge outbound firewall block not verified' }
          "YUTANG_EDGE_EXE=$($edge[0])" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'EDGE_OUTBOUND_BLOCK_VERIFIED: no Douyin, account, or remote network access from Edge.'

      - name: Compare default Edge sandbox with per-process NetworkServiceSandbox feature
        shell: pwsh
        env:
          YUTANG_EDGE_FIREWALL_CONFIRMED: 'yes'
        run: |
          $ErrorActionPreference='Stop'
          & $env:YUTANG_NODE 'tools/node24_network_service_sandbox_probe.mjs' $env:YUTANG_RUNTIME
          if($LASTEXITCODE -ne 0) { throw 'Network Service sandbox A/B did not pass; no product change is authorized.' }

      - name: Remove temporary firewall rule
        if: always()
        shell: pwsh
        run: |
          Remove-NetFirewallRule -DisplayName 'YuTangNetworkSandboxProbeBlockOutbound' -ErrorAction SilentlyContinue
          Write-Host 'DISPOSABLE_RUNNER_CLEANUP: temporary Edge firewall rule removed.'
