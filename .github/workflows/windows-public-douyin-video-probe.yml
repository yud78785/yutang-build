name: YuTang public Douyin video capture probe (NO LOGIN / NO MODEL / NOT RELEASE)

on:
  pull_request:
    paths:
      - .github/workflows/windows-public-douyin-video-probe.yml
      - tools/windows_public_douyin_video_probe.mjs
      - tools/resolve-candidate-artifact.ps1
      - tools/patch-core-direct-video.mjs
      - tests/test-core-direct-video-patch.mjs

permissions:
  contents: read
  actions: read

jobs:
  public-video-capture:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Refuse self-hosted or wrong-repository Windows execution
        shell: pwsh
        env:
          YUTANG_RUNNER_KIND: ${{ runner.environment }}
          YUTANG_REPOSITORY: ${{ github.repository }}
          YUTANG_EVENT: ${{ github.event_name }}
          YUTANG_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          YUTANG_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          YUTANG_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Not inside GitHub Actions; refusing Windows execution.' }
          if ($env:YUTANG_RUNNER_KIND -cne 'github-hosted') { throw 'Self-hosted or unknown runner forbidden; do not execute on a user PC.' }
          if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64') { throw 'Unexpected runner OS or architecture.' }
          if ($env:YUTANG_EVENT -cne 'pull_request' -or $env:GITHUB_EVENT_NAME -cne 'pull_request') { throw 'Only reviewed pull-request test events are allowed.' }
          if ($env:YUTANG_REPOSITORY -cne 'yud78785/yutang-build' -or $env:GITHUB_REPOSITORY -cne 'yud78785/yutang-build') { throw 'Unexpected repository; refusing execution.' }
          if ($env:YUTANG_HEAD_REPOSITORY -cne 'yud78785/yutang-build' -or $env:YUTANG_BASE_REPOSITORY -cne 'yud78785/yutang-build') { throw 'Forked or unrelated PR source forbidden.' }
          if ($env:YUTANG_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Missing immutable PR head SHA.' }
          Write-Host 'YUTANG_GITHUB_HOSTED_RUNNER_VERIFIED: trusted pull request on disposable Windows x64 runner'
      - name: Checkout reviewed probe without persisted Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify smoke harness syntax and process safety assertions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check tools/windows_public_douyin_video_probe.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Public video probe syntax failed' }
          node tools/windows_public_douyin_video_probe.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic process ownership assertions failed' }

      - name: Resolve exact PR head candidate from its own successful build
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          YUTANG_TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          YUTANG_TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          & ./tools/resolve-candidate-artifact.ps1 -Purpose public-video
          if ($LASTEXITCODE -ne 0) { throw 'Candidate identity resolver failed closed.' }

      - name: Permit ordinary Edge egress only on disposable CI runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $profiles=@(Get-NetFirewallProfile)
          if ($profiles.Count -lt 1 -or @($profiles | Where-Object {$_.DefaultOutboundAction -eq 'Block'}).Count -gt 0) { throw 'Runner has a default outbound block policy; refusing to weaken global policy.' }
          $locations=@(
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          )
          $edge=@($locations | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if ($edge.Count -ne 1) { throw 'Expected exactly one installed Edge executable.' }
          if ((Get-AuthenticodeSignature -LiteralPath $edge[0]).Status -ne 'Valid') { throw 'Microsoft Edge signature verification failed.' }
          $existing=Get-NetFirewallRule -DisplayName 'YuTangPublicDouyinEdgeEgress' -ErrorAction SilentlyContinue
          if ($existing) { throw 'Unexpected pre-existing test firewall rule.' }
          $blockRules=@(Get-NetFirewallRule -Direction Outbound -Action Block -Enabled True -ErrorAction Stop)
          foreach ($rule in $blockRules) {
            $application=Get-NetFirewallApplicationFilter -AssociatedNetFirewallRule $rule -ErrorAction Stop
            if ($application.Program -eq 'Any' -or $application.Program -ieq $edge[0]) { throw 'An explicit outbound block rule applies to Edge; refusing to override it.' }
          }
          $allow=New-NetFirewallRule -DisplayName 'YuTangPublicDouyinEdgeEgress' -Direction Outbound -Program $edge[0] -Action Allow -Profile Any -ErrorAction Stop
          if ($allow.Action -ne 'Allow' -or $allow.Direction -ne 'Outbound' -or $allow.Enabled -ne 'True') { throw 'Could not verify the Edge outbound allow rule.' }
          "YUTANG_EDGE_EXE=$($edge[0])" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'EDGE_EGRESS_ALLOWED: disposable runner only; no account, cookies, model key or posting.'

      - name: Run candidate Core against one public video; stop on login or verification
        shell: pwsh
        env:
          YUTANG_PUBLIC_VIDEO_TEST_ALLOWED: 'yes'
          YUTANG_EXPECTED_CANDIDATE_SHA256: ${{ steps.source.outputs.exe_sha }}
        run: |
          node tools/windows_public_douyin_video_probe.mjs '${{ steps.source.outputs.exe }}'
          if ($LASTEXITCODE -ne 0) { throw 'Public video Core capture or candidate lifecycle probe failed.' }

      - name: Upload redacted result and at most three JPEG video frames (one-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YuTang-Public-Douyin-Video-Probe
          path: ${{ runner.temp }}/yutang-public-video-evidence/*
          if-no-files-found: warn
          retention-days: 1

      - name: Preserve strict non-release boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host 'NO LOGIN: login/captcha/verification or unsupported page causes a safe stop; no bypass.'
          Write-Host 'NO MODEL: API configuration remains empty; no model/API keys are passed to the candidate.'
          Write-Host 'NO ACTIONS: no likes, comments, follows, shares, posts, downloads, or account changes.'
          Write-Host 'NO RELEASE: one public video probe is not evidence of reliable long-term autonomy or cross-machine safety.'
