name: YuTang public Douyin video capture probe (NO LOGIN / NO MODEL / NOT RELEASE)

on:
  pull_request:
    paths:
      - .github/workflows/windows-public-douyin-video-probe.yml
      - tools/windows_public_douyin_video_probe.mjs

permissions:
  contents: read
  actions: read

jobs:
  public-video-capture:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed probe without persisted Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify smoke harness syntax and process safety assertions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check tools/windows_public_douyin_video_probe.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Public video probe syntax failed' }
          node tools/windows_public_douyin_video_probe.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic process ownership assertions failed' }

      - name: Fetch exact isolated candidate and verify ZIP/EXE hashes before execution
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $archive=Join-Path $env:RUNNER_TEMP 'YuTang-Public-Douyin-Candidate.zip'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri 'https://api.github.com/repos/yud78785/yutang-build/actions/artifacts/13861132013/zip' -Headers $headers -MaximumRedirection 5 -OutFile $archive
          $expectedArchive='0f9f3ece06c7df9d7ab9772cd86732286d4dd209790e9adb3d2fe4e10e10411d'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedArchive) { throw 'Candidate ZIP hash mismatch; refusing extraction.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries=@($zip.Entries)
            $allowed=@('Dafeiyu-Douyin-API-1.4.6-win-x64.exe','YUTANG-RESULT.txt')
            if ($entries.Count -ne 2 -or @($entries | Where-Object {$allowed -cnotcontains $_.FullName}).Count -ne 0 -or @($entries.FullName | Select-Object -Unique).Count -ne 2) { throw 'Candidate ZIP entries are not the exact expected files.' }
            $exeEntry=@($entries | Where-Object {$_.FullName -eq $allowed[0]})[0]
            if (-not $exeEntry -or $exeEntry.Length -lt 50000000 -or $exeEntry.Length -gt 200000000) { throw 'Candidate EXE size is outside the expected bound.' }
          } finally { $zip.Dispose() }
          $directory=Join-Path $env:RUNNER_TEMP 'YuTang-Public-Douyin-Candidate'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive,$directory)
          $exe=Join-Path $directory 'Dafeiyu-Douyin-API-1.4.6-win-x64.exe'
          $expectedExe='c334971b305caaf5a6335f74bcf6111045013637e91bd7a02f1ceeeb0f4705f9'
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedExe) { throw 'Candidate EXE hash mismatch; refusing execution.' }
          "exe=$exe" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'PUBLIC_VIDEO_CANDIDATE_IDENTITY_PASS: exact artifact ZIP and EXE verified.'

      - name: Permit ordinary Edge egress only on disposable CI runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $profiles=@(Get-NetFirewallProfile)
          if ($profiles.Count -lt 1 -or @($profiles | Where-Object {$_.DefaultOutboundAction -ne 'Allow'}).Count -gt 0) { throw 'Runner outbound policy is not default-allow; refusing to alter global policy.' }
          $locations=@(
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          )
          $edge=@($locations | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if ($edge.Count -ne 1) { throw 'Expected exactly one installed Edge executable.' }
          if ((Get-AuthenticodeSignature -LiteralPath $edge[0]).Status -ne 'Valid') { throw 'Microsoft Edge signature verification failed.' }
          $existing=Get-NetFirewallRule -DisplayName 'YuTangPublicDouyinEdgeEgress' -ErrorAction SilentlyContinue
          if ($existing) { throw 'Unexpected pre-existing test firewall rule.' }
          $allow=New-NetFirewallRule -DisplayName 'YuTangPublicDouyinEdgeEgress' -Direction Outbound -Program $edge[0] -Action Allow -Profile Any -ErrorAction Stop
          if ($allow.Action -ne 'Allow' -or $allow.Direction -ne 'Outbound' -or $allow.Enabled -ne 'True') { throw 'Could not verify the Edge outbound allow rule.' }
          "YUTANG_EDGE_EXE=$($edge[0])" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'EDGE_EGRESS_ALLOWED: disposable runner only; no account, cookies, model key or posting.'

      - name: Run candidate Core against one public video; stop on login or verification
        shell: pwsh
        env:
          YUTANG_PUBLIC_VIDEO_TEST_ALLOWED: 'yes'
        run: |
          node tools/windows_public_douyin_video_probe.mjs '${{ steps.source.outputs.exe }}'
          if ($LASTEXITCODE -ne 0) { throw 'Public video Core capture or candidate lifecycle probe failed.' }

      - name: Upload redacted result and at most three JPEG video frames (one-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YuTang-Public-Douyin-Video-Probe
          path: ${{ runner.temp }}/yutang-public-video-evidence/*
          if-no-files-found: warn
          retention-days: 1

      - name: Preserve strict non-release boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host 'NO LOGIN: login/captcha/verification or unsupported page causes a safe stop; no bypass.'
          Write-Host 'NO MODEL: API configuration remains empty; no model/API keys are passed to the candidate.'
          Write-Host 'NO ACTIONS: no likes, comments, follows, shares, posts, downloads, or account changes.'
          Write-Host 'NO RELEASE: one public video probe is not evidence of reliable long-term autonomy or cross-machine safety.'
