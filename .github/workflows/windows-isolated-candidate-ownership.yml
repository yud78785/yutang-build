name: YuTang isolated EXE real Edge lifecycle (NO ACCOUNTS / NOT RELEASE)

on:
  push:
    branches:
      - hardening/candidate-fresh-profile-bounded-launch-20261111
    paths:
      - .github/workflows/windows-isolated-candidate-ownership.yml
      - tools/windows_isolated_candidate_edge_smoke.mjs
  pull_request:
    paths:
      - .github/workflows/windows-isolated-candidate-ownership.yml
      - tools/windows_isolated_candidate_edge_smoke.mjs

permissions:
  contents: read
  actions: read

jobs:
  isolated-edge-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed smoke code without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify immutable smoke assertions and test syntax
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check tools/windows_isolated_candidate_edge_smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Isolated packaged smoke script failed Node syntax verification' }
          node tools/windows_isolated_candidate_edge_smoke.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Process-ownership safety regressions failed' }

      - name: Fetch exact not-for-release candidate by artifact ID and check ZIP/EXE identity
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $artifactId=13871502345
          $archive=Join-Path $env:RUNNER_TEMP 'YuTang-Isolated-EXE-Exact.zip'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri "https://api.github.com/repos/yud78785/yutang-build/actions/artifacts/$artifactId/zip" -Headers $headers -MaximumRedirection 5 -OutFile $archive
          $expectedArchive='9da9e1f0f8ef5b401fd5ae77e683a890fb9230fcff0fb3c9a5041bc427681e7e'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedArchive) { throw 'Artifact ZIP SHA256 mismatch: refusing to extract or execute.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries=@($zip.Entries)
            $allowed=@('Dafeiyu-Douyin-API-1.4.6-win-x64.exe','YUTANG-RESULT.txt')
            if ($entries.Count -ne 2 -or @($entries | Where-Object {$allowed -cnotcontains $_.FullName}).Count -ne 0 -or @($entries.FullName | Select-Object -Unique).Count -ne 2) { throw 'ZIP contains unexpected/duplicate paths, refusing extraction.' }
            $exeEntry=@($entries | Where-Object {$_.FullName -eq $allowed[0]})[0]
            if (-not $exeEntry -or $exeEntry.Length -lt 50000000 -or $exeEntry.Length -gt 200000000) { throw 'Invalid candidate EXE size in artifact ZIP.' }
          } finally { $zip.Dispose() }
          $directory=Join-Path $env:RUNNER_TEMP 'YuTang-Isolated-Signed-Edge-Only'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive,$directory)
          $exe=Join-Path $directory 'Dafeiyu-Douyin-API-1.4.6-win-x64.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Expected candidate executable missing.' }
          $expectedExe='ac02053ff2f95897d581518e8ce80fed28de6c101e5a3f2e767f1cf6c42bde7d'
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedExe) { throw 'Candidate EXE SHA256 mismatch: refusing execution.' }
          "exe=$exe" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'ISOLATED_CANDIDATE_IDENTITY_PASS: exact ZIP and EXE bytes; signing trust is NOT established.'

      - name: Block signed Edge outbound traffic before any browser may launch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $locations=@(
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          )
          $edge=@($locations | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if ($edge.Count -ne 1) { throw 'Expected exactly one installed Edge executable; refusing to launch.' }
          if ((Get-AuthenticodeSignature -LiteralPath $edge[0]).Status -ne 'Valid') { throw 'Microsoft Edge signature could not be verified.' }
          $rule=New-NetFirewallRule -DisplayName 'YuTangEphemeralEdgeOutboundBlock' -Direction Outbound -Program $edge[0] -Action Block -Profile Any -ErrorAction Stop
          if ($rule.Action -ne 'Block' -or $rule.Direction -ne 'Outbound' -or $rule.Enabled -ne 'True') { throw 'Edge egress block not proven.' }
          "YUTANG_EDGE_EXE=$($edge[0])" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'EDGE_EGRESS_BLOCKED: no real Douyin, model, or accounts in this disposable CI test.'

      - name: Run actual packaged EXE cold start, owned Edge, sandbox and cleanup tests
        shell: pwsh
        env:
          YUTANG_EDGE_FIREWALL_CONFIRMED: 'yes'
        run: |
          node tools/windows_isolated_candidate_edge_smoke.mjs '${{ steps.source.outputs.exe }}'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged isolated candidate failed exact Edge ownership/lifecycle gate. NOT RELEASE.' }

      - name: Preserve release block
        if: always()
        shell: pwsh
        run: |
          Write-Host 'CANDIDATE_ONLY: no real user Windows machine, Douyin account, API key, posting, or external Edge network.'
          Write-Host 'SANDBOX_GATE: verify Renderer Lockdown/Untrusted/AppContainer plus Network Service sandbox type, live AppContainer SID and dedicated process lineage.'
          Write-Host 'NO_RELEASE: real Douyin public video, actual content understanding, model autonomy, and cross-machine stability are not proven.'
