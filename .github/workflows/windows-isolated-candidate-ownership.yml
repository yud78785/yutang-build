name: YuTang isolated EXE real Edge lifecycle (NO ACCOUNTS / NOT RELEASE)

on:
  pull_request:
    paths:
      - .github/workflows/windows-isolated-candidate-ownership.yml
      - tools/windows_isolated_candidate_edge_smoke.mjs
      - tools/resolve-candidate-artifact.ps1

permissions:
  contents: read
  actions: read

jobs:
  isolated-edge-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed smoke code without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify immutable smoke assertions and test syntax
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --check tools/windows_isolated_candidate_edge_smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Isolated packaged smoke script failed Node syntax verification' }
          node tools/windows_isolated_candidate_edge_smoke.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Process-ownership safety regressions failed' }

      - name: Resolve exact PR head candidate from its own successful build
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          YUTANG_TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          YUTANG_TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          & ./tools/resolve-candidate-artifact.ps1 -Purpose lifecycle
          if ($LASTEXITCODE -ne 0) { throw 'Candidate identity resolver failed closed.' }

      - name: Block signed Edge outbound traffic before any browser may launch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $locations=@(
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
          )
          $edge=@($locations | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if ($edge.Count -ne 1) { throw 'Expected exactly one installed Edge executable; refusing to launch.' }
          if ((Get-AuthenticodeSignature -LiteralPath $edge[0]).Status -ne 'Valid') { throw 'Microsoft Edge signature could not be verified.' }
          $rule=New-NetFirewallRule -DisplayName 'YuTangEphemeralEdgeOutboundBlock' -Direction Outbound -Program $edge[0] -Action Block -Profile Any -ErrorAction Stop
          if ($rule.Action -ne 'Block' -or $rule.Direction -ne 'Outbound' -or $rule.Enabled -ne 'True') { throw 'Edge egress block not proven.' }
          "YUTANG_EDGE_EXE=$($edge[0])" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'EDGE_EGRESS_BLOCKED: no real Douyin, model, or accounts in this disposable CI test.'

      - name: Run actual packaged EXE cold start, owned Edge, sandbox and cleanup tests
        shell: pwsh
        env:
          YUTANG_EDGE_FIREWALL_CONFIRMED: 'yes'
          YUTANG_EXPECTED_CANDIDATE_SHA256: ${{ steps.source.outputs.exe_sha }}
        run: |
          node tools/windows_isolated_candidate_edge_smoke.mjs '${{ steps.source.outputs.exe }}'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged isolated candidate failed exact Edge ownership/lifecycle gate. NOT RELEASE.' }
          node tools/windows_isolated_candidate_edge_smoke.mjs '${{ steps.source.outputs.exe }}' --force-host
          if ($LASTEXITCODE -ne 0) { throw 'INTEGRATED Job Object host-only forced-termination regression failed. NOT RELEASE.' }
          node tools/windows_isolated_candidate_edge_smoke.mjs '${{ steps.source.outputs.exe }}' --force-guard
          if ($LASTEXITCODE -ne 0) { throw 'INTEGRATED Job Object helper-only forced-termination regression failed. NOT RELEASE.' }
          node tools/windows_isolated_candidate_edge_smoke.mjs '${{ steps.source.outputs.exe }}' --force-desktop
          if ($LASTEXITCODE -ne 0) { throw 'INTEGRATED desktop-main forced-termination regression failed. NOT RELEASE.' }

      - name: Prove eight independent packaged Electron desktop cold starts
        shell: pwsh
        timeout-minutes: 20
        env:
          YUTANG_EDGE_FIREWALL_CONFIRMED: 'yes'
          YUTANG_EXPECTED_CANDIDATE_SHA256: ${{ steps.source.outputs.exe_sha }}
        run: |
          $ErrorActionPreference='Stop'
          for ($round=1; $round -le 8; $round++) {
            Write-Host "DESKTOP_COLD_START_ROUND $round of 8 (real EXE, UI/IPC/HTTP, no Edge)"
            node tools/windows_isolated_candidate_edge_smoke.mjs '${{ steps.source.outputs.exe }}' --desktop-only
            if ($LASTEXITCODE -ne 0) { throw "Packaged Electron desktop readiness failed in independent boot $round. CANDIDATE NOT RELEASE." }
          }
          Write-Host 'DESKTOP_COLD_START_GATE_VERIFIED: 8 independent EXE/UI/IPC/HTTP startups, all fail-closed and cleaned.'

      - name: Repeat bounded cold starts across two fresh candidate profiles
        shell: pwsh
        timeout-minutes: 25
        env:
          YUTANG_EDGE_FIREWALL_CONFIRMED: 'yes'
          YUTANG_EXPECTED_CANDIDATE_SHA256: ${{ steps.source.outputs.exe_sha }}
        run: |
          $ErrorActionPreference='Stop'
          for ($round=1; $round -le 2; $round++) {
            Write-Host "COLD_START_STRESS_ROUND $round of 2 (8 starts per round, no outbound Edge network)"
            node tools/windows_isolated_candidate_edge_smoke.mjs '${{ steps.source.outputs.exe }}' --stress-restarts=7
            if ($LASTEXITCODE -ne 0) { throw "Cold-start stress regression failed in round $round. CANDIDATE NOT RELEASE." }
          }
          Write-Host 'COLD_START_STRESS_VERIFIED: 16 launches, 14 restarts, two independent candidate profiles, all owned processes cleaned.'

      - name: Preserve release block
        if: always()
        shell: pwsh
        run: |
          Write-Host 'CANDIDATE_ONLY: no real user Windows machine, Douyin account, API key, posting, or external Edge network.'
          Write-Host 'SANDBOX_GATE: verify Renderer Lockdown/Untrusted/AppContainer plus Network Service sandbox type, live AppContainer SID and dedicated process lineage.'
          Write-Host 'NO_RELEASE: real Douyin public video, actual content understanding, model autonomy, and cross-machine stability are not proven.'
