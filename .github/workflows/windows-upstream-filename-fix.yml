name: YuTang Windows 2022/2025 pinned source tree repair test (NO EXE)

on:
  push:
    branches:
      - experiment/windows-upstream-filename-fix-20261113
    paths:
      - .github/workflows/windows-upstream-filename-fix.yml
      - tools/apply_openrouter_desktop_patch.mjs
      - tools/verify_pinned_windows_upstream_tree.mjs
      - tests/windows-upstream-filename-fix.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-tree:
    name: ${{ matrix.os }} - pinned full-source SHA-256
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    concurrency:
      group: yutang-windows-source-tree-repair-${{ matrix.os }}
      cancel-in-progress: true

    steps:
      - name: Checkout only experimental fix branch with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configure pinned Node 24 build-independent runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.17.0

      - name: Fetch and confirm exact pristine upstream product commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'EXPECTED_WINDOWS_RUNNER' }
          if ($env:GITHUB_REF -ne 'refs/heads/experiment/windows-upstream-filename-fix-20261113') { throw 'EXPECTED_FIX_BRANCH' }
          git init upstream
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          git -C upstream config core.autocrlf false
          git -C upstream remote add origin https://github.com/LockyBee/dsh-douyin-agent.git
          if ($LASTEXITCODE -ne 0) { throw 'git remote add failed' }
          git -C upstream fetch --depth=1 origin 9c49833078f4b4d18b9211ef86d024e7f2e15739
          if ($LASTEXITCODE -ne 0) { throw 'upstream fetch failed' }
          git -C upstream checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'upstream checkout failed' }
          $sourceHead = (git -C upstream rev-parse HEAD).Trim()
          if ($sourceHead -cne '9c49833078f4b4d18b9211ef86d024e7f2e15739') { throw ('UPSTREAM_HEAD_MISMATCH: ' + $sourceHead) }

      - name: Apply strictly pinned production compatibility patch and syntax check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/apply_openrouter_desktop_patch.mjs upstream
          if ($LASTEXITCODE -ne 0) { throw 'FAIL_CLOSED_PATCH_APPLICATION' }
          node --check upstream/desktop/scripts/acquire-upstream.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PATCHED_ACQUIRE_SYNTAX_ERROR' }

      - name: Run seven isolated filename-repair security regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test tests/windows-upstream-filename-fix.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'FILENAME_REPAIR_TEST_FAILURE' }

      - name: Download official pinned source archive and verify full source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node upstream/desktop/scripts/acquire-upstream.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_UPSTREAM_TREE_STILL_MISMATCHED' }
          node tools/verify_pinned_windows_upstream_tree.mjs
          if ($LASTEXITCODE -ne 0) { throw 'INDEPENDENT_PINNED_TREE_VERIFICATION_FAILED' }

      - name: Upload small redacted source hash and exact-file receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: YuTang-Windows-Pinned-Source-Tree-${{ matrix.os }}-NOT-EXE
          path: diagnostics/windows-upstream-tree-receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Assert test is not executable acceptance
        if: always()
        shell: pwsh
        run: |
          Write-Output 'READONLY SOURCE-TREE AND FIXTURE REGRESSION ONLY.'
          Write-Output 'NO WINDOWS EXE BUILD OR SMOKE. NO MODEL OR PAID API CALLS.'
          Write-Output 'NO PUBLIC VIDEO REPLAY, NO USER PC, NO MAIN BRANCH, NO MERGE, NO RELEASE.'
