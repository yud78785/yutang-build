name: YuTang Windows upstream extraction diagnostic (NO EXE)

on:
  push:
    branches:
      - experiment/video-component-pilot-20261113
    paths:
      - .github/workflows/windows-upstream-extraction-diagnostic.yml
      - tools/diagnose_windows_upstream_extraction.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Checkout experiment source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pinned Node.js diagnostic runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.17.0

      - name: Fetch exact upstream desktop source and apply same pinned patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git init upstream
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          git -C upstream config core.autocrlf false
          git -C upstream remote add origin https://github.com/LockyBee/dsh-douyin-agent.git
          if ($LASTEXITCODE -ne 0) { throw 'git remote add failed' }
          git -C upstream fetch --depth=1 origin 9c49833078f4b4d18b9211ef86d024e7f2e15739
          if ($LASTEXITCODE -ne 0) { throw 'pinned upstream fetch failed' }
          git -C upstream checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'pinned upstream checkout failed' }
          $actual = (git -C upstream rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne '9c49833078f4b4d18b9211ef86d024e7f2e15739') { throw ('UPSTREAM_COMMIT_MISMATCH: ' + $actual) }
          node tools/apply_openrouter_desktop_patch.mjs upstream
          if ($LASTEXITCODE -ne 0) { throw 'exact-source patch failed' }

      - name: Compare Windows extraction implementations and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/diagnose_windows_upstream_extraction.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows extraction diagnostic failed' }

      - name: Upload redacted extraction comparison (not source, not EXE)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: YuTang-Windows-Upstream-Extraction-Diagnostic-${{ matrix.os }}-NOT-EXE
          path: diagnostics/windows-upstream-extraction.json
          if-no-files-found: warn
          retention-days: 7

      - name: Strict diagnostic-only boundary
        if: always()
        shell: pwsh
        run: |
          Write-Output 'PUBLIC SOURCE ARCHIVE HASH AND WINDOWS EXTRACTOR COMPARISON ONLY.'
          Write-Output 'NO UPSTREAM CODE EXECUTION, NO MODEL API, NO WINDOWS EXE, NO USER PC, NO RELEASE.'
